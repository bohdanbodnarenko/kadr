name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package list comes from the filesystem rather than from a matrix written out here.
  # The hand-written one had quietly lost StudioCore, so its tests were not running — the
  # failure mode of a second list is that nobody notices it is short.
  discover:
    name: Find the packages
    runs-on: macos-26
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "packages=$(make packages-json)" >> "$GITHUB_OUTPUT"

  # docs/04 §2: "CI builds packages in parallel."
  packages:
    name: ${{ matrix.package }}
    needs: discover
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version && xcodebuild -version
      - name: Test ${{ matrix.package }}
        run: make test-package PACKAGE=${{ matrix.package }}

  app:
    name: Build agent app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build workspace
        run: make build
      - name: Test the agent app
        run: make test-app
      - name: Test the editor app
        run: make test-editor
      # The archive, not the build product: `xcodebuild build` plus a strip is not what
      # ships, and measuring it reported 16 MB for a release that downloads at 12.9 MB.
      - name: App bundle size budget (PRD §8)
        run: make size-gate
      - name: Linked frameworks contain no networking (docs/03 §9)
        run: make check-layering
      - name: Performance budgets (PRD §8)
        run: Scripts/check-perf.sh --idle-seconds 30 --json perf-results.json
      - name: Publish the measured budgets
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-results.json
          if-no-files-found: warn

  static:
    name: Lint and architecture checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat
      - name: Lint and format check
        run: make lint
      - name: Layering, zero-network and agent-linkage checks (docs/04 §11)
        run: make check-layering
      - name: Size check runs clean without a build product
        run: make check-size
