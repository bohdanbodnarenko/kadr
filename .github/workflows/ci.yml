name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package list comes from the filesystem rather than from a matrix written out here.
  # The hand-written one had quietly lost StudioCore, so its tests were not running — the
  # failure mode of a second list is that nobody notices it is short.
  discover:
    name: Find the packages
    timeout-minutes: 5
    runs-on: macos-26
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "packages=$(make packages-json)" >> "$GITHUB_OUTPUT"

  # docs/04 §2: "CI builds packages in parallel."
  packages:
    name: ${{ matrix.package }}
    timeout-minutes: 25
    needs: discover
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version && xcodebuild -version
      - name: Test ${{ matrix.package }}
        run: make test-package PACKAGE=${{ matrix.package }}

  app:
    name: Build agent app
    timeout-minutes: 60
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build workspace
        run: make build
      - name: Test the agent app
        run: make test-app
      - name: Test the editor app
        run: make test-editor
      - name: Build the agent tests for the macOS 14 run
        run: make test-app-build
      # Tarred first: upload-artifact drops Unix permissions and symlinks, so the bundle
      # arrived with no executable bits and broken framework links, and launchd refused to
      # start the test runner ("Launchd job spawn failed").
      - name: Pack the built tests
        run: tar -czf agent-tests.tar.gz -C build/Build Products
      - name: Hand the built tests to the macOS 14 job
        uses: actions/upload-artifact@v4
        with:
          name: agent-tests
          path: agent-tests.tar.gz
          retention-days: 1
      # The archive, not the build product: `xcodebuild build` plus a strip is not what
      # ships, and measuring it reported 16 MB for a release that downloads at 12.9 MB.
      - name: App bundle size budget (PRD §8)
        run: make size-gate
      - name: Linked frameworks contain no networking (docs/03 §9)
        run: make check-layering
      - name: Build the editor app
        run: make build-editor
      - name: String Catalogs match the source (docs/18 X-4)
        run: make check-strings
      - name: Performance budgets (PRD §8)
        run: Scripts/check-perf.sh --idle-seconds 30 --json perf-results.json
      - name: Publish the measured budgets
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-results.json
          if-no-files-found: warn

  # The deployment target. Its runners cannot build with the current SDK, so this runs the
  # bundle the app job built; several surfaces branch on macOS 26, and the older branch was
  # otherwise never exercised (docs/18 X-7).
  macos14:
    name: Agent tests on macOS 14
    timeout-minutes: 30
    needs: app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: agent-tests
      - name: Unpack the built tests
        run: mkdir -p build/Build && tar -xzf agent-tests.tar.gz -C build/Build
      - name: Run the agent tests
        run: make test-app-run

  static:
    name: Lint and architecture checks
    timeout-minutes: 15
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned SwiftLint and SwiftFormat
        run: make lint-tools
      - name: Lint and format check
        run: make lint
      - name: Layering, zero-network and agent-linkage checks (docs/04 §11)
        run: make check-layering
      - name: Size check runs clean without a build product
        run: make check-size
