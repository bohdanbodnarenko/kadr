# Kadr — SwiftLint configuration
# Style rules are deliberately light; the rules that matter to this project
# (layering, zero-network, no timers at idle) are enforced by Scripts/check-layering.sh.

included:
  - Kadr
  - KadrTests
  - Packages

excluded:
  - "**/.build"
  - "**/Package.swift"
  - DerivedData
  - build
  - docs

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: false

identifier_name:
  min_length: 2
  excluded: [x, y, w, h, r, dx, dy, id, to, at, on]

type_name:
  min_length: 3

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 350
  error: 500

nesting:
  type_level: 2

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - yoda_condition

disabled_rules:
  - todo

custom_rules:
  localized_menu_title:
    name: "Localized menu title"
    regex: 'withTitle:\s*"'
    message: "Use String(localized:) for menu titles so they appear in the catalog."
    included: ".*(AppMenu|EditorAppDelegate\\+Menu)\\.swift"
    severity: warning
